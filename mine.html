<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Neet Hub</title>
	
	<style>
		body {  /* nothing for general, # for id, . for class */
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
        }
		
        #loginPage,
        .pageStyleB {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }
		
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }
		
        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }
		
        #messages {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
		
        .message {
            background: #eeeeee;
            padding: 8px;
            margin: 5px;
            border-radius: 8px;
        }
		
        .message b {
            display: block;
        }
		
        .pageStyleB {
            display: none;
        }
		
		#emergencyBubble {
			position: fixed;
			right: 20px;
			
			width: 55px;
			height: 55px;
			
			border-radius: 50%;
			border: none;
			
			background: #222;
			color: white;
			
			font-size: 20px;
			cursor: grab;
			z-index: 9999;
			
			margin: 0;
			padding: 0;
			
			user-select: none;
			touch-action: none;
		}
		
		#emergencyBubble:active {
			cursor: grabbing;
		}
		
		.mask-password {
			-webkit-text-security: disc;
			text-security: disc;
		}
	
	</style>
	
</head>

<body>
	<button id="emergencyBubble">●</button>
	<div id="loginPage">
		<h1> Neet Hub </h1>
		<h2> Login </h2>
		
		<input
			id = "username"
			type = "text"
			placeholder = "Username"
			autocomplete = "off"
		>
		
		<input
			id = "password"
			type = "text"
			class = "mask-password"
			placeholder = "Password"
			autocomplete = "new-password"
		>
		
		<button onclick="login()"> Login </button>
		<button onclick="register()"> Register </button>
		
		<p id="loginStatus"></p>
	</div>
	
	<div id="chatPage" class="pageStyleB">
		<h1> Neet Hub Chat </h1>
		<p>
			Logged in as:
			<b id="currentUser"></b>
		</p>
		
		<button onclick="logout()"> Logout </button>
		
		<hr>
		
		<div id="messages"></div>
		
		<input
			id = "messageInput"
			type = "text"
			placeholder="Type a message..."
		>
		
		<button onclick="sendMessage()"> Send </button>
	</div>
	
	<div id="adminPage" class="pageStyleB">
		<button onclick="logout()"> Exit </button>
		<hr>
		
		<div id="adminPanel" class="pageStyleB">
			<h1> Admin Control Panel </h1>
			
			<button onclick="clearhistory()"> Clear history </button>
			<hr>
			
			<button onclick="manageAccounts()"> Manage Accounts </button>
			<hr>
			
			<button onclick="managehistory()"> Manage history </button>
			<hr>
			
			<button onclick="system(1)"> Enable New User Registration </button>
			<button onclick="system(2)"> Disable New User Registration </button>
			<hr>
			
			<button onclick="system(3)"> Freeze System </button>
			<button onclick="system(4)"> Unfreeze System </button>
			<hr>
		
		</div>
		
		<div id="accountManager" class="pageStyleB">
			<h1> Account Manager </h1>
			<button onclick="backToAdmin()"> Back </button>
			
			<div id="accounts"></div>
		</div>
		
		<div id="historyManager" class="pageStyleB">
			<h1> History Manager </h1>
			<button onclick="backToAdmin()"> Back </button>
			
			<div id="history"></div>
		</div>
	</div>
	
	<script type="module">
		import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
		
		import {
			getDatabase,
			ref,
			set,
			get,
			push,
			onValue,
			remove
		} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";
		
		const firebaseConfig = {
			apiKey: "AIzaSyAZZ7Rima-d6qFOUeiWKykUI_5yqW4vKig",
			authDomain: "neet-hub-33eef.firebaseapp.com",
			databaseURL: "https://neet-hub-33eef-default-rtdb.asia-southeast1.firebasedatabase.app",
			projectId: "neet-hub-33eef",
			storageBucket: "neet-hub-33eef.firebasestorage.app",
			messagingSenderId: "654893266181",
			appId: "1:654893266181:web:a6509fd16c469c47e5336c",
			measurementId: "G-HPRY0H6ZKX"
		};
		
		const app = initializeApp(firebaseConfig);
		const db = getDatabase(app);
		
		let currentUser = null;
		let stopMessageListener = null;
		
		const BASE = "";
		const REF = {
			secure: BASE + "/secure",
			users: BASE + "/users",
			messages: BASE + "/messages",
			frozen: BASE + "/frozen",
			newReg: BASE + "/reg"
		};
		
		function GE(element) { return document.getElementById(element); }
		
		async function update(key, value) {
			await set(ref(db, key), value);
		}
		
		async function fetch(key) {
			const snap = await get(ref(db, key));
			if (snap.exists()) {
				return snap.val();
			}
			
			return null;
		}
		
		
		function setLoginStatus(txt) {
			GE("loginStatus").textContent = txt;
		}
		
		let emergencyTriggered = false;
		const emergencyBubble = GE("emergencyBubble");
		
		let dragging = false;
		let moved = false;
		let offsetX = 0;
		let offsetY = 0;
		
		emergencyBubble.addEventListener("pointerdown", function(event) {
			dragging = true;
			moved = false;
			
			const rect = emergencyBubble.getBoundingClientRect();
			
			offsetX = event.clientX - rect.left;
			offsetY = event.clientY - rect.top;
			
			emergencyBubble.setPointerCapture(event.pointerId);
		});
		
		emergencyBubble.addEventListener("pointermove", function(event) {
			if (!dragging) {return;}
			
			moved = true;
			let x = event.clientX - offsetX;
			let y = event.clientY - offsetY;
			
			const maxX = window.innerWidth - emergencyBubble.offsetWidth;
			const maxY = window.innerHeight - emergencyBubble.offsetHeight;
			
			x = Math.max(0, Math.min(x, maxX));
			y = Math.max(0, Math.min(y, maxY));
			
			emergencyBubble.style.left = x + "px";
			emergencyBubble.style.top = y + "px";
			
			emergencyBubble.style.right = "auto";
			emergencyBubble.style.bottom = "auto";
		});
		
		emergencyBubble.addEventListener("pointerup", function(event) {
			dragging = false;
			
			emergencyBubble.releasePointerCapture(event.pointerId);
			
			if (!moved) {
				emergency();
			}
		});
		
		window.clearhistory = async function() {
			await update(REF.messages, {});
		};
		
		window.emergency = function() {
			if (emergencyTriggered) { return; }
			
			emergencyTriggered = true;
			if (stopMessageListener) {
				stopMessageListener();
				stopMessageListener = null;
			}
			
			currentUser = null;
			
			GE("chatPage").style.display = "none";
			GE("adminPage").style.display = "none";
			Array.from(GE("adminPage").children).forEach(child => {
			  child.style.display = "none";
			});
			
			GE("messages").innerHTML = "";
			
			GE("username").value = "";
			GE("password").value = "";
			
			GE("loginPage").style.display = "block";
		};
		
		window.addEventListener("deviceorientation", function(event) {
			const beta = event.beta;
			
			if (beta === null) {
				return;
			}
			
			if (Math.abs(beta) > 150) {
				emergency();
			}
		});
		
		window.register = async function() {
			const user = GE("username").value.trim();
			const pass = GE("password").value.trim();
			
			if (!user || !pass) {
				setLoginStatus("Enter Username and Password.");
				return;
			}
			
			if (await fetch(REF.newReg) === false) {
				setLoginStatus("Registrations Closed By Admin.");
				return;
			}
			
			const existing =
				await fetch(
					REF.secure + "/" + user
				);
			
			if (existing != null) {
				setLoginStatus("Username Already Exists.");
				return;
			}
			
			await update(
				REF.secure + "/" + user,
				pass
			);
			
			
			await update(
				REF.users + "/" + user,
				{
					username: user
				}
			);
			
			setLoginStatus("Account Created! You can now login.");
		
		};
		
		
		window.login = async function() {
			emergencyTriggered = false;
			
			const user = GE("username").value.trim();
			const pass = GE("password").value.trim();
			
			if (!user || !pass) {
				setLoginStatus("Enter Username and Password.");
				return;
			}
			
			if ((await fetch(REF.frozen) === true) && (user !== "ADMIN")) {
				setLoginStatus("System Frozen by Admin.");
				return;
			}
			
			const stored = await fetch(REF.secure + "/" + user);
			
			if (stored !== null && stored === pass) {
				if (user == "ADMIN") {
					GE("loginPage").style.display = "none";
					GE("adminPage").style.display = "block";
					GE("adminPanel").style.display = "block";
					return;
				}
				currentUser = user;
				
				GE("currentUser").textContent = user;
				GE("loginPage").style.display = "none";
				GE("chatPage").style.display = "block";
				
				startMessageListener();
			} else {
				setLoginStatus("Invalid Username or Password.");
			}
		}
		
		
		window.sendMessage = async function() {
			if (!currentUser) {
				return;
			}
			
			const input = GE("messageInput");
			const text = input.value.trim()
			
			if (!text) { return; }
			
			const messageRef = 
				push(
					ref(db, REF.messages)
				);
			
			await set(messageRef,
				{
					sender: currentUser,
					text: text,
					tstamp: Date.now()
				}
			);
			
			input.value = "";
		}
		
		
		function startMessageListener() {
			const messagesRef = 
				ref(db, REF.messages)
		
			stopMessageListener =
				onValue(
					messagesRef,
					(snap) => {
						const cont = GE("messages");
						
						cont.innerHTML = "";
						
						const data = snap.val();
						
						if (!data) { return; }
						
						const messages = Object.values(data);
						
						messages.sort(
							(a,b) => a.tstamp - b.tstamp
						);
						
						for ( const message of messages ) {
							const div = document.createElement("div");
							div.className = "message";
							
							const name = document.createElement("b");
							
							name.textContent = message.sender;
							
							const text = document.createElement("span");
							text.textContent = message.text;
							
							div.appendChild(name); div.appendChild(text);
							
							cont.appendChild(div);
						}
						
						cont.scrollTop = cont.scrollHeight;
						
					}
				);
		}
		
		window.logout = function() {
			if (stopMessageListener) {
				stopMessageListener();
				stopMessageListener = null;
			}
			
			currentUser = null;
			
			Array.from(GE("adminPage").children).forEach(child => {
			  child.style.display = "none";
			});
			
			GE("chatPage").style.display = "none";
			GE("adminPage").style.display = "none";
			GE("loginPage").style.display = "block";
			
			GE("messages").innerHTML = "";
			
			GE("username").value = "";
			GE("password").value = "";
			
			setLoginStatus("");
			
		};
		
		window.backToAdmin = function() {
			Array.from(GE("adminPage").children).forEach(child => {
			  child.style.display = "none";
			});
			GE("adminPanel").style.display = "block";
		}
		
		window.manageAccounts = async function() {
			GE("adminPanel").style.display = "none";
			GE("accountManager").style.display = "block";
			
			const cont = GE("accounts");
			cont.innerHTML = "";
			
			const data = await fetch(REF.users);
			
			if (!data) {
				cont.textContent = "No accounts found.";
				return;
			}
			
			const accounts = Object.keys(data);
			
			for (const account of accounts) {
				if (account == "ADMIN") { continue; }
				const div = document.createElement("div");
				div.className = "account";
				
				const name = document.createElement("span");
				name.textContent = account;
				
				const brk = document.createElement("br");
				const hrk = document.createElement("hr");
				const but = document.createElement("button");
				
				but.textContent = "Delete";
				but.onclick = function() {
					deleteAccount(account);
				};
				
				div.appendChild(name);
				div.appendChild(brk);
				div.appendChild(but);
				div.appendChild(hrk);
				
				cont.appendChild(div);
			}
		};
		
		
		window.managehistory = async function() {
			GE("adminPanel").style.display = "none";
			GE("historyManager").style.display = "block";
			
			const cont = GE("history");
			cont.innerHTML = "";
			
			const data = await fetch(REF.messages);
			
			if (!data) {
				cont.textContent = "No history Yet.";
				return;
			}
			
			const history = Object.entries(data);
			
			for (const [msgID, msgData] of history) {
				const div = document.createElement("div");
				div.className = "historyEntry";
				
				const brk = document.createElement("br");
				const hrk = document.createElement("hr");
				
				const name = document.createElement("b");
				name.textContent = msgData.sender;
				
				const msgText = document.createElement("p");
				msgText.textContent = msgData.text;
				
				const stamp = document.createElement("p");
				const date = new Date(msgData.tstamp);
				stamp.textContent = date.toLocaleString();
				
				const but = document.createElement("button");
				
				but.textContent = "Delete";
				but.onclick = function() {
					deleteMessage(msgID);
				};
				
				div.appendChild(name);
				div.appendChild(msgText);
				div.appendChild(stamp);
				div.appendChild(but); div.appendChild(hrk);
				
				cont.appendChild(div);
			}
		};
		
		async function deleteAccount(acc) {
			await remove(ref(db, REF.secure + "/" + acc));
			await remove(ref(db, REF.users + "/" + acc));
			manageAccounts();
		}
		
		async function deleteMessage(msgID) {
			await remove(ref(db, REF.messages + "/" + msgID));
			managehistory();
		}
		
		window.system = async function(hash) {
			if (hash == 1) { await update(REF.newReg, true); }
			if (hash == 2) { await update(REF.newReg, false); }
			if (hash == 3) { await update(REF.frozen, true); }
			if (hash == 4) { await update(REF.frozen, false); }
		};
		
		
		GE("messageInput").addEventListener(
			"keydown",
			function(event) {
				if (event.key === "Enter") { sendMessage(); }
			}
		);
	
		
	</script>
</body>

</html>
