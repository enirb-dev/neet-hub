<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Neet Hub</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
	<link rel="stylesheet" href="css/styleCool.css">
	<link rel="icon" type="image/x-icon" href="/favicon.ico">
	
</head>

<body>
	<button id="emergencyBubble" class="fixedButton">●</button>
	<!-- <div id="sensorDebug" style="position:fixed; top:5px; left:5px; background:rgba(0,0,0,0.7); color:#0f0; font-family:monospace; font-size:12px; padding:4px 8px; border-radius:4px; z-index:99999; pointer-events:none;">
		Waiting for sensor...
	</div> -->
	
	<div id="queryPage" class="superTop" hidden>
		<p id="query_q"></p>
		<input id="query_i" type="text">
		<input id="query_p" type="password">
		
		<button id="query_b" onclick="queryPageButtonClicked()"> Ok </button>
		<button id="query_b2" onclick="queryPageButtonClicked(true)"> Cancel </button>
	</div>
	
	<!-- <div style=" -->
		<!-- font-family: 'Noto Color Emoji'; -->
		<!-- font-size: 80px; -->
	<!-- "> -->
		<!-- 😀 😂 🥰 😎 🤩 ❤️ 🔥 🚀 👨‍👩‍👧‍👦 -->
	<!-- </div> -->
	
	<div id="loginPage" style="background: white">
		<p id="loginStatus"></p>
		<h1> Neet Hub </h1>
		<h2> Login </h2>
		<h3> Stamp: 078 </h3>
		
		
		
		<input
			id = "username"
			type = "text"
			placeholder = "username"
			autocomplete = "off"
		>
		
		<input
			id = "password"
			type = "text"
			class = "mask-password"
			placeholder = "Password"
			autocomplete = "new-password"
		>
		
		<button onclick="login()"> Login </button>
		<button onclick="register()"> Register </button>
	</div>
	
	<div id="appWorking">
		<div id="bannerTop" class="banner" style="display: none">
			<button onclick="window.location.reload(true)" class="B"> Reload (Press to fix Glitches) </button>
			<button onclick="toggleEmergencyActivity()" class="B" id="emergencyToggle"> Emergency: Enabled </button>
			<button onclick="toggleNotifications()" class="B" id="notificationToggle"> Notifications: Disabled </button>
			<h1 id="roomTitle" style="padding: 3px 5px 3px 5px; margin: 0px"> Neet Hub Chat </h1>
		</div>
		
		<div id="chatPage" class="pageStyleB">
			<p>
				Logged in as:
				<b id="currentUser"></b>
				<button onclick="logout()"> Logout </button>
			</p>
			<b>
			<div id="onlineHasher"></div>
			<span class="onlineDot" id="onlineDot"></span>
			</b>
			
			<hr>
			
			<div id="messages"></div>
			
			<label for="scrollToBottom" class="icon-btn" title="goToBottom" style="float: right; font-size: 50px">🔻</label>
			<button id="scrollToBottom" onclick="scrollToBottomF()" class="fixedButton" hidden>🔻</button>
			
			<div id="replyingBar" style="display:none;"></div>
			
			<div id="bannerChat" class="banner B">
				<input
					id = "messageInput"
					type = "text"
					placeholder="Type a message..."
				>
				
				<button onclick="sendMessage()"> Send </button>
				<button onclick="callUser()"> Call </button>
				
				<label for="recBut" class="icon-btn" title="Record">🎙</label>
				<button onclick="recordingTrigger()" style="padding: 3px 8px; font-size: 20px" class="icon-btn" id="recBut" hidden></button>
				
				<label for="messageFile" class="file-btn" title="Attach-File">📎</label>
				<input type="file" id="messageFile" multiple hidden>
			</div>
			<hr>
			<button onclick="showRooms()"> Private Chats </button>
		
		</div>
		
		<div id="roomsPage" class="pageStyleB">
			<button onclick="backToGlobal()"> Back </button>
			<h1> Private Chats </h1>
			<hr>
			<button onclick="createRoom()"> Create Room </button>
			<p> </p>
			
			<div id="rooms"></div>
		</div>
		
		<div id="adminPage" class="pageStyleB">
			<button onclick="logout()"> Exit </button>
			<hr>
			
			<div id="adminPanel" class="pageStyleB">
				<h1> Admin Control Panel </h1>
				
				<button onclick="clearhistory()"> Clear history </button>
				<button onclick="managehistory()"> Manage history </button>
				<hr>
				
				<button onclick="manageAccounts()"> Manage Accounts </button>
				<button onclick="showLastSeens()"> Last Seens </button>
				<hr>
				
				<button onclick="system(1)"> Enable New User Registration </button>
				<button onclick="system(2)"> Disable New User Registration </button>
				<hr>
				
				<button onclick="system(3)"> Freeze System </button>
				<button onclick="system(4)"> Unfreeze System </button>
				<hr>
				
				<button onclick="showLog()"> Check Log </button>
				<hr>
			
			</div>
			
			<div id="accountManager" class="pageStyleB">
				<h1> Account Manager </h1>
				<button onclick="backToAdmin()"> Back </button>
				
				<button onclick="admin(1)"> Reset a Password </button>
				
				<div id="accounts"></div>
			</div>
			
			<div id="lastSeensPage" class="pageStyleB">
				<h1> Last Seens </h1>
				<button onclick="backToAdmin()"> Back </button>
				
				<div id="lastSeens"></div>
			</div>
			
			<div id="historyManager" class="pageStyleB">
				<h1> History Manager </h1>
				<button onclick="backToAdmin()"> Back </button>
				
				<div id="history"></div>
			</div>
			
			<div id="logPage" class="pageStyleB">
				<h1> Log Page </h1>
				<button onclick="backToAdmin()"> Back </button>
				<button onclick="system(5)"> Clear Log </button>
				<button onclick="showLog(true)"> See User Logs </button>
				<br>
				
				<div id="logDiv"></div>
			</div>
		</div>
		
		<div id="callPage" class="pageStyleB">
			<h1>Neet Hub Call</h1>
			<h2 id="callHead"></h2>
			<h2 id="callPerson"></h2>
			<p id="callStatus"></p>
			<button id="callButton"></button>
			<button id="muteButton" onclick="toggleMute()"> Mute </button>
			<audio id="remoteAudio" autoplay playsinline></audio>
		</div>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@17.0.3/dist/twemoji.min.js"
		crossorigin="anonymous"></script>   <!-- Tweemoji Font Support -->
	<script type="module" src="js/script.js"></script>
</body>

</html>
